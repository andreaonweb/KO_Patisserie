databases:
  - name: ko-patisserie-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # --- Backend: API FastAPI ---
  - type: web
    name: ko-patisserie-back
    runtime: python
    plan: free
    region: oregon
    rootDir: ko_back
    buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: ko-patisserie-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ko-patisserie-front.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # --- Frontend: Angular (sitio estático) ---
  - type: web
    name: ko-patisserie-front
    runtime: static
    rootDir: ko_front
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/DEL_signal_test/browser
    envVars:
      - key: API_URL
        value: https://ko-patisserie-back.onrender.com
      - key: TMB_APP_ID
        sync: false
      - key: TMB_APP_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
