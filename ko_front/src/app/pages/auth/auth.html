<section class="auth">
  <form class="auth__card" (ngSubmit)="submit()" aria-label="Acceso">
    <h1 class="auth__title">{{ isLogin() ? 'Entrar' : 'Crear cuenta' }}</h1>

    <label class="field">Email
      <input type="email" name="email" [(ngModel)]="email" placeholder="tu@email.com" autocomplete="username" required />
    </label>

    <label class="field">Contraseña
      <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••"
        [attr.autocomplete]="isLogin() ? 'current-password' : 'new-password'" required />
    </label>

    @if (error()) {
    <p class="msg-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn-dark" [disabled]="loading()">
      {{ loading() ? 'Cargando…' : (isLogin() ? 'Entrar' : 'Registrarme') }}
    </button>

    <div class="auth__demo">
      <p>Cuentas demo</p>
      <div class="auth__demo-actions">
        <button type="button" class="btn-ghost" [disabled]="loading()" (click)="demoLogin('customer')">Entrar como cliente</button>
        <button type="button" class="btn-ghost" [disabled]="loading()" (click)="demoLogin('admin')">Entrar como admin</button>
      </div>
    </div>

    <p class="auth__toggle">
      {{ isLogin() ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
      <button type="button" class="auth__link" (click)="toggleMode()">{{ isLogin() ? 'Regístrate' : 'Inicia sesión' }}</button>
    </p>
  </form>
</section>
